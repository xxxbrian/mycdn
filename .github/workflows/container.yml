name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Check Go and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded frontend
        run: make web
      - name: Test frontend
        run: pnpm --dir web test
      - name: Test Go, shared state and vet
        run: make test race vet

  image:
    name: Build and smoke-test ${{ matrix.arch }}
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.checks.outputs.image }}
      VERSION: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push untagged image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Check version, frontend, real requests and restart
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker run --rm "$image" -version)" = "$VERSION"

          cleanup() {
            docker logs mycdn-ci
            docker rm --force --volumes mycdn-ci
          }
          trap cleanup EXIT
          export MYCDN_ADMIN_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$MYCDN_ADMIN_KEY"
          docker run --detach --name mycdn-ci --network host \
            --env MYCDN_ADMIN_KEY "$image"

          wait_for_admin() {
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:8081/healthz > /dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_admin
          curl --fail --silent --show-error http://127.0.0.1:8081/ > "$RUNNER_TEMP/index.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"
          python3 scripts/smoke.py
          docker exec mycdn-ci sh -c 'printf persisted > /data/.ci-volume-check'
          docker stop --time 30 mycdn-ci
          docker start mycdn-ci
          wait_for_admin
          test "$(docker exec mycdn-ci cat /data/.ci-volume-check)" = persisted
          python3 scripts/smoke.py
      - name: Export tested digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform tags
    needs: [checks, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.checks.outputs.image }}
      VERSION: sha-${{ github.sha }}
      BRANCH_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit and branch tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          images=()
          for file in "$RUNNER_TEMP"/digests/*; do
            images+=("$IMAGE@sha256:$(basename "$file")")
          done
          branch_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH_TAG" --jq '.object.sha')
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$branch_head" == "$GITHUB_SHA" ]]; then
            tags+=(--tag "$IMAGE:$BRANCH_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          {
            echo '## Container image'
            echo
            echo "- Commit tag: \`$IMAGE:$VERSION\`"
            if [[ "$branch_head" == "$GITHUB_SHA" ]]; then
              echo "- Branch tag: \`$IMAGE:$BRANCH_TAG\`"
            else
              echo '- Branch tag unchanged: this commit is no longer the branch head.'
            fi
            echo "- Pinned digest: \`$IMAGE@$digest\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo '- No Dokploy deployment is triggered.'
          } >> "$GITHUB_STEP_SUMMARY"
